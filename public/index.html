<style>
/* Layout: iOS「リマインダー」準拠の1カラムアプリ。下部にリマインくん式の自然文入力バーを常設 */
:root {
  --bg: #f2f2f7; --card: #ffffff; --fg: #000000; --fg2: #8a8a8e; --fg3: #c4c4c7; --sep: rgba(60,60,67,.18);
  --fill: rgba(118,118,128,.12); --blue: #007aff; --red: #ff3b30; --orange: #ff9500; --green: #34c759;
  --purple: #af52de; --gray: #8e8e93; --teal: #30b0c7; --indigo: #5856d6; --bar: rgba(249,249,249,.94);
  --shadow: 0 10px 30px rgba(0,0,0,.18);
  /* 動きのトークン（ui-ux-pro-max: motion-consistency）。押下は速く、戻りと入場はばね、退場は短く */
  --ease-out: cubic-bezier(.22,1,.36,1); --ease-in: cubic-bezier(.4,0,1,1); --spring: cubic-bezier(.34,1.45,.64,1);
  --ease-sheet: cubic-bezier(.32,.72,0,1); --t-press: 80ms; --t-exit: 220ms;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1c1c1e; --fg: #ffffff; --fg2: #98989f; --fg3: #48484a; --sep: rgba(84,84,88,.6);
  --fill: rgba(118,118,128,.24); --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158;
  --purple: #bf5af2; --gray: #98989d; --teal: #40c8e0; --indigo: #5e5ce6; --bar: rgba(22,22,24,.94);
  --shadow: 0 10px 30px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fg: #ffffff; --fg2: #98989f; --fg3: #48484a; --sep: rgba(84,84,88,.6);
  --fill: rgba(118,118,128,.24); --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158;
  --purple: #bf5af2; --gray: #98989d; --teal: #40c8e0; --indigo: #5e5ce6; --bar: rgba(22,22,24,.94);
  --shadow: 0 10px 30px rgba(0,0,0,.6); color-scheme: dark; }
html, body { height: 100%; }
/* ダブルタップでの拡大と、文字サイズの自動調整を止める（入力時のズームは viewport と 16px 以上の文字で防ぐ） */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 520px; margin: 0 auto; height: var(--vvh, 100%); display: flex; flex-direction: column; position: relative; background: var(--bg); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ナビゲーションバー */
.nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; padding-block: 4px; }
.nav .left { justify-self: start; } .nav .right { justify-self: end; display: flex; gap: 6px; }
.navbtn { color: var(--blue); display: inline-flex; align-items: center; gap: 2px; font-size: 17px; min-height: 44px; }
.navbtn svg { width: 22px; height: 22px; }
/* 右上・左上のボタンは丸い面を付けて大きく（タップ領域 44px） */
.nav .navbtn { min-width: 44px; justify-content: center; }
.nav .right .navbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--fill); }
.nav .navbtn svg { width: 26px; height: 26px; }
#backBtn { font-size: 18px; padding-right: 6px; margin-left: -6px; }
#backBtn svg { width: 30px; height: 30px; }
.nav-title { font-weight: 600; opacity: 0; transition: opacity .2s; }
.nav-title.show { opacity: 1; }
.scroll { flex: 1; overflow-y: auto; background: var(--bg); view-transition-name: page; -webkit-overflow-scrolling: touch; padding-block: 0 24px; }
.large { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 2px 0 12px; text-wrap: balance; }

/* 検索 */
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 8px; height: 36px; margin-bottom: 18px; }
.search svg { width: 16px; height: 16px; color: var(--fg2); flex: none; }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 17px; }
.search input::placeholder { color: var(--fg2); }

/* スマートリスト */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.home-h { margin: 0 2px 10px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--fg2); letter-spacing: .04em; }
.home-t { margin: 0; }
.pills { display: flex; gap: 8px; margin-bottom: 28px; }
.pill { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--card); font-size: 15px; font-weight: 600; color: var(--fg); transition: transform .5s var(--spring), filter .3s, background-color .25s; }
.pill .pdot { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.pill .pdot svg { width: 14px; height: 14px; }
.pill .pn { margin-left: auto; color: var(--fg2); font-variant-numeric: tabular-nums; }
.pill.is-pressed { transform: scale(.95); filter: grayscale(1); transition-duration: var(--t-press); }
.sec-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sec-row .sec-h { margin: 0; }
.sec-row .addlist { margin: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); }
.sec-row .addlist svg { width: 18px; height: 18px; }
.tile { background: var(--card); border-radius: 14px; padding: 12px 14px 11px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; text-align: left; min-height: 82px; }
.tile .ic { width: 32px; height: 32px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; }
.tile .ic svg { width: 18px; height: 18px; }
.tile .num { font-size: 28px; font-weight: 700; line-height: 32px; font-variant-numeric: tabular-nums; }
.tile .lbl { grid-column: 1 / -1; align-self: end; font-weight: 600; color: var(--fg2); font-size: 15px; margin-top: 8px; }
.sec-h { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 14px; text-align: left; min-height: 52px; }
.lrow { position: relative; }
.lrow + .lrow::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.lrow .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; flex: none; }
.lrow .dot svg { width: 17px; height: 17px; }
.lrow .name { flex: 1; min-width: 0; }
.lrow .cnt { color: var(--fg2); font-variant-numeric: tabular-nums; }
.lrow .chev { width: 8px; color: var(--fg3); }
.addlist { color: var(--blue); margin-top: 14px; font-size: 17px; }
.hint { color: var(--fg2); font-size: 13px; line-height: 1.5; margin: 16px 4px 0; text-align: center; }

/* リマインダー行 */
.items { display: flex; flex-direction: column; }
.day-h { font-size: 20px; font-weight: 700; margin: 22px 0 4px; display: flex; align-items: baseline; gap: 8px; }
.day-h small { font-size: 13px; color: var(--red); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; position: relative; }
.row::after { content: ""; position: absolute; left: 36px; right: 0; bottom: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--fg3); flex: none; margin-top: 1px; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: transparent; transition: background .15s; }
.row.done .check, .check.on { border-color: var(--c); }
.row.done .check::after, .check.on::after { background: var(--c); }
.row-main { flex: 1; min-width: 0; text-align: left; }
.row-title { line-height: 1.3; word-break: break-word; }
.row.done .row-title { color: var(--fg2); }
.prio { color: var(--c); font-weight: 700; margin-right: 3px; }
.row-sub { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 15px; color: var(--fg2); margin-top: 3px; align-items: center; }
.row-sub .over { color: var(--red); }
.row-sub .rep { display: inline-flex; align-items: center; gap: 3px; }
.row-sub svg { width: 13px; height: 13px; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.badge.snz { background: color-mix(in srgb, var(--indigo) 16%, transparent); color: var(--indigo); }
.row-notes { font-size: 15px; color: var(--fg2); margin-top: 2px; }
.flag { color: var(--orange); width: 16px; flex: none; margin-top: 3px; }
.empty { text-align: center; color: var(--fg2); padding: 48px 12px; line-height: 1.6; }
.foot-note { color: var(--fg2); font-size: 13px; margin-top: 18px; }

/* 入力バー（リマインくん式） */
.composer { background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.qform { display: flex; gap: 8px; align-items: center; }
.qform input { flex: 1; min-width: 0; height: 50px; border-radius: 25px; border: .5px solid var(--sep); background: var(--card); padding: 0 18px; font-size: 17px; outline: none; transition: border-color .2s, box-shadow .25s var(--ease-out); }
.qform input:focus, .urlrow input:focus, .chat-in input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent); }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px color-mix(in srgb, var(--blue) 40%, transparent); }
.send:disabled { background: var(--fg3); box-shadow: none; transform: scale(.86); }
.send svg { width: 22px; height: 22px; }
.preview { background: var(--card); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; box-shadow: 0 1px 0 var(--sep); }
.pv-title { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--fg); display: inline-flex; gap: 4px; align-items: center; }
.chip.k { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
.chip.n { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.chip.w { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.pv-note { font-size: 12px; color: var(--fg2); }
.pv-ask { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--fg2); }
.pv-ask button { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); font-weight: 600; }
.linkbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--fg2); flex: none; }
.linkbtn[aria-pressed="true"], .linkbtn.has { color: var(--blue); }
.linkbtn svg { width: 22px; height: 22px; }
.urlrow { display: flex; gap: 8px; align-items: center; }
.urlrow input { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: .5px solid var(--sep); background: var(--card); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
.urlrow .lab { font-size: 13px; color: var(--fg2); white-space: nowrap; }
.chip.u { background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlink { display: inline-flex; align-items: center; gap: 3px; color: var(--blue); text-decoration: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlink svg { flex: none; }
.bn-main { display: block; color: inherit; text-decoration: none; }
.bn-url { font-size: 13px; color: var(--blue); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet.tall { height: calc(100% - 40px - env(safe-area-inset-top, 0px)); }
.chat { flex: 1; overflow-y: auto; padding-block: 16px; display: flex; flex-direction: column; gap: 10px; }
.bub { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; }
.bub .av { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; }
.bub .tx { padding: 9px 13px; border-radius: 18px; line-height: 1.45; font-size: 16px; word-break: break-word; }
.bub.bot .tx { background: var(--card); border-bottom-left-radius: 6px; }
.bub.me { align-self: flex-end; }
.bub.me .tx { background: var(--blue); color: #fff; border-bottom-right-radius: 6px; }
.bub .sub { display: block; font-size: 13px; color: var(--fg2); margin-top: 3px; }
.bub.pop { animation: pop .5s var(--spring) both; transform-origin: bottom left; }
.bub.bot.pop .tx { animation: grow .45s .5s var(--spring) both; transform-origin: left center; }
@keyframes grow { from { transform: scale(.96); } }
.bub.me.pop { transform-origin: bottom right; }
@keyframes pop { from { transform: translateY(10px) scale(.9); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .bub.pop { animation: none; } }
.chat-in { border-top: .5px solid var(--sep); background: var(--bar); padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.chat-in .chips button { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: .5px solid var(--sep); color: var(--blue); font-weight: 600; }
.chat-in .chips button.skip { color: var(--fg); }
.chat-in form { display: flex; gap: 8px; }
.chat-in input { flex: 1; min-width: 0; height: 50px; border-radius: 25px; border: .5px solid var(--sep); background: var(--card); padding: 0 18px; font-size: 17px; outline: none; transition: border-color .2s, box-shadow .25s var(--ease-out); }
.chat-in .next { height: 50px; padding: 0 20px; border-radius: 25px; background: var(--blue); color: #fff; font-weight: 600; flex: none; }
.steps { display: flex; gap: 4px; justify-content: center; padding-top: 2px; }
.steps i { width: 18px; height: 4px; border-radius: 2px; background: var(--fill); }
.steps i.on { background: var(--blue); }
.newbtn { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 600; font-size: 17px; min-height: 36px; }
.newbtn .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
.newbtn .plus svg { width: 14px; height: 14px; }
.cbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cbar .mode { font-size: 12px; color: var(--fg2); }
.confirm-note { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--fg2); line-height: 1.5; margin: 0 4px; }
.confirm-note b { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-size: 11px; display: grid; place-items: center; }
.gsteps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.gs { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--fill); color: var(--fg); font-variant-numeric: tabular-nums; }
.gs.done { text-decoration: line-through; color: var(--fg2); }
.gs.next { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); font-weight: 600; }
.gbadge { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
.gstep { padding: 8px 12px 8px 16px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 30px; gap: 4px 8px; align-items: center; position: relative; }
.gstep + .gstep::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.gstep .no { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.gstep input[type=text] { width: 100%; min-width: 0; border: 0; background: transparent; outline: none; padding: 8px 0; font-size: 17px; }
.gstep .tm { font-size: 14px; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gstep .rm { width: 28px; height: 28px; border-radius: 50%; color: var(--red); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.gstep .sub { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--fg2); }
.gstep .sub input[type=number] { width: 64px; text-align: right; border: 0; background: var(--fill); border-radius: 8px; padding: 5px 8px; font-size: 16px; }
.gstep .sub select { border: 0; background: var(--fill); border-radius: 8px; padding: 5px 8px; font-size: 16px; }
.gstep .sub input[type=url] { flex: 1; min-width: 0; border: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 16px; color: var(--blue); }
.gstep.done input[type=text] { text-decoration: line-through; color: var(--fg2); }
.gsum { font-size: 13px; color: var(--fg2); margin: 6px 16px 0; font-variant-numeric: tabular-nums; }
.inl { display: flex; gap: 8px; align-items: center; padding: 8px 16px; }
.inl input[type=text] { flex: 1; min-width: 0; border: 0; background: var(--fill); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.inl button { color: var(--blue); font-weight: 600; white-space: nowrap; }
.toast .undo { color: var(--blue); font-weight: 700; margin-left: 10px; filter: brightness(1.4); }
.f input[type=url] { width: 100%; border: 0; background: transparent; outline: none; padding: 12px 0; font-size: 16px; color: var(--blue); }
.examples { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.composer:not(:focus-within) .examples { display: none; }
.cbar .newbtn + .mode + .newbtn { color: var(--fg2); }
.examples::-webkit-scrollbar { display: none; }
.ex { white-space: nowrap; font-size: 13px; padding: 6px 11px; border-radius: 999px; background: var(--card); border: .5px solid var(--sep); }

/* シート */
.sheet-wrap { position: fixed; left: 0; right: 0; top: 0; height: var(--vvh, 100%); background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: scrimIn .35s var(--ease-out); }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; position: relative; animation: up .52s var(--ease-sheet); box-shadow: 0 -8px 30px rgba(0,0,0,.12); }
.sheet::before { content: ""; position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--fg3); opacity: .7; z-index: 1; }
.sheet.dragging { animation: none; transition: none; }
.sheet.settle { transition: transform .45s var(--spring); }
.sheet-wrap.closing { pointer-events: none; animation: scrimOut var(--t-exit) var(--ease-in) forwards; }
.sheet-wrap.closing .sheet { animation: down var(--t-exit) var(--ease-in) forwards; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes scrimIn { from { background-color: transparent; } }
@keyframes scrimOut { to { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 56px; padding-top: 6px; border-bottom: .5px solid var(--sep); touch-action: none; }
.sheet-h .t { font-weight: 600; }
.sheet-h .r { justify-self: end; font-weight: 600; }
.sheet-b { overflow-y: auto; padding-block: 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
.fgroup { background: var(--card); border-radius: 12px; overflow: hidden; }
.fgroup-h { font-size: 13px; color: var(--fg2); margin: 0 16px 6px; letter-spacing: .02em; }

:is(.newbtn, .send, .linkbtn, .addlist, .ex, .act-btn, .pv-ask button, .chat-in .chips button, .chat-in .next, .bn-acts button, .bn-acts a.btnlike, .wd button, .colors button, .seg button, .gstep .rm, .inl button, .guide code, .sw-btn).is-pressed:not(:disabled) { transform: scale(.9); filter: grayscale(1) brightness(.88); opacity: .6; transition-duration: var(--t-press); }

/* 画面遷移: 右から重なって入り、戻るときは右へ抜ける（ui-ux-pro-max: continuity / hierarchy-motion） */

function rowHtml(r) {

function groupRowHtml(r) {

function completeStep(r, i) {
  const st = r.steps[i]; if (!st) return '';
  st.done = true; st.doneAt = fmtLocal(new Date()); st.snoozeUntil = null;
  if (r.steps.every(x => x.done)) { r.done = true; r.doneAt = fmtLocal(new Date()); save(); return `「${st.title}」を完了。グループ「${r.title}」はすべて完了しました`; }
  save();
  const nx = nextStep(r);
  return `「${st.title}」を完了（${r.steps.filter(x => x.done).length}/${r.steps.length}）${nx ? `。次は ${nx.st.title} ${fmtDue(nx.t)}` : ''}`;
}

// ---- 完了・スヌーズ ----
function completeRem(r) {
  const now = new Date();
  r.history = r.history || [];
  r.history.push(fmtLocal(now));
  r.snoozeUntil = null; r.lastNotified = null; r.lastNagAt = null; r.nagCount = 0;
  if (r.rule) {
    r.count = (r.count || 0) + 1;
    const next = nextOnComplete(r, now);
    if (next) { r.due = fmtLocal(next); save(); return `次回は ${fmtDue(next)} です`; }
  }
  r.done = true; r.doneAt = fmtLocal(now); save();
  return r.rule ? '繰り返しが終了しました' : '完了にしました';
}
function snooze(r, mins) {
  const d = new Date(); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + mins);
  r.snoozeUntil = fmtLocal(d); r.lastNotified = null; r.lastNagAt = null; save();
  return `${fmtDue(d)} にもう一度お知らせします`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-smart],[data-list],[data-check],[data-open],#backBtn,#addListBtn,#editListBtn,#helpBtn,#dataBtn,.ex');
  if (!t) return;
  if (t.dataset.smart) navigate({ name: 'list', smart: t.dataset.smart }, 'fwd');
  else if (t.dataset.list) navigate({ name: 'list', list: t.dataset.list }, 'fwd');
  else if (t.dataset.check) {
    const r = S.reminders.find(x => x.id === t.dataset.check); if (!r) return;
    if (r.done) { r.done = false; r.doneAt = null; if (isGroup(r)) r.steps.forEach(x => { x.done = false; x.lastNotified = null; }); save(); render(); return; }
    t.classList.add('on');
    // 完了で一覧から消えるものは、チェックが描かれた後に右へ抜け、行の高さが縮んで詰まる
    const row = t.closest('.swipe') || t.closest('.row');
    const leaves = !isGroup(r) && !r.rule && !reduceMotion() && row;
    if (leaves) setTimeout(() => {
      row.classList.add('leaving'); row.querySelector('.row')?.classList.add('leaving');
      const h = row.offsetHeight;
      row.animate([{ opacity: 1, transform: 'none', height: h + 'px' }, { opacity: 0, transform: 'translateX(40px)', height: h + 'px', offset: .5 }, { opacity: 0, transform: 'translateX(40px)', height: '0px', paddingTop: '0px', paddingBottom: '0px' }],
        { duration: 420, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
    }, 420);
    const wait = leaves ? 860 : 520;
    if (isGroup(r)) { setTimeout(() => { const nx = nextStep(r); if (nx) toast(esc(completeStep(r, nx.i))); render(); }, wait); return; }
    setTimeout(() => { const msg = completeRem(r); toast(`「${esc(r.title)}」${msg}`); render(); }, wait);
  }
  else if (t.dataset.open) { const r = S.reminders.find(x => x.id === t.dataset.open); if (r && isGroup(r)) openGroupEditor(r.id); else openDetail(t.dataset.open); }
  else if (t.id === 'backBtn') navigate({ name: 'home' }, 'back');
  else if (t.id === 'addListBtn') openListEditor(null);
  else if (t.id === 'editListBtn') openListEditor(view.list);
  else if (t.id === 'helpBtn') openHelp();
  else if (t.id === 'dataBtn') openData();
  else if (t.classList.contains('ex')) { const q = $('#quick'); q.value = t.dataset.ex; q.focus(); updatePreview(); }
});

let W = null;
const STEP_ORDER = ['what', 'when', 'url'];

function openWizard(init) {
  W = { log: [], step: 'what', title: null, due: null, rule: null, nag: null, url: init.url || null, listId: init.listId, extra: init.extra || {}, inputs: [], urlAsked: false };
  openSheet(`<div class="sheet-h gut"><button class="navbtn" data-act="cancel">キャンセル</button><div class="t">新規リマインダー</div><span></span></div>
    <div class="chat gut" id="wChat" aria-live="polite"></div>
    <div class="chat-in gut"><div class="steps" id="wSteps"></div><div class="chips" id="wChips"></div>
      <form id="wForm" autocomplete="off" novalidate><input id="wIn" type="text" enterkeyhint="next" aria-label="返事を入力"><button class="next" id="wNext" type="submit">次へ</button></form></div>`, sh => {
    sh.classList.add('tall');
    sh.querySelector('[data-act="cancel"]').onclick = () => { W = null; closeSheet(); };

    sh.querySelector('#wChips').addEventListener('click', e => { const b = e.target.closest('[data-ans]'); if (b) wizardAnswer(b.dataset.ans, b.textContent); });
    wizardBot('何をリマインドしますか？', '「千葉、東京、神奈川」のように並べると、グループとして時間差で登録できます');
    wizardPrompt();
    if (init.text) setTimeout(() => wizardAnswer(init.text), 250);

function wizardBot(text, sub) { W.log.push({ who: 'bot', text, sub }); drawChat(); }
function wizardMe(text) { W.log.push({ who: 'me', text }); drawChat(); }
function drawChat() {
  const c = document.querySelector('#wChat'); if (!c) return;
  c.innerHTML = W.log.map((m, i) => m.who === 'bot'
    ? `<div class="bub bot ${i === W.log.length - 1 ? 'pop' : ''}"><span class="av">り</span><div class="tx">${esc(m.text)}${m.sub ? `<span class="sub">${esc(m.sub)}</span>` : ''}</div></div>`
    : `<div class="bub me ${i === W.log.length - 1 ? 'pop' : ''}"><div class="tx">${esc(m.text)}</div></div>`).join('');

}
function wizardPrompt() {
  const inp = document.querySelector('#wIn'), chips = document.querySelector('#wChips'), next = document.querySelector('#wNext');
  if (!inp) return;
  const idx = Math.max(0, STEP_ORDER.indexOf(W.step));
  document.querySelector('#wSteps').innerHTML = STEP_ORDER.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('') + '<i></i>';

    inp.type = 'text'; inp.inputMode = 'text'; inp.placeholder = '例: 明日の件、資料を送る'; next.textContent = '次へ'; chips.innerHTML = '';
  } else if (W.step === 'when') {
    inp.type = 'text'; inp.inputMode = 'text'; inp.placeholder = '例: 明日の9時、毎週月曜8時、30分後'; next.textContent = '次へ';
    chips.innerHTML = (W.sugg ? `<button type="button" data-ans="__sugg">${esc(whenText(W.sugg.due, W.sugg.rule))}</button>` : '') + [...QUICK_WHEN, ['毎日 朝8時', '毎日 朝8時'], ['平日 8時', '平日 8時']].map(([l, t]) => `<button type="button" data-ans="${esc(t)}">${esc(l)}</button>`).join('') + '<button type="button" class="skip" data-ans="__none">日時なし</button>';
  } else if (W.step === 'url') {
    inp.type = 'text'; inp.inputMode = 'url'; inp.autocapitalize = 'off'; inp.placeholder = 'https://…（なければ「なし」）'; next.textContent = '次へ';

function wizardAnswer(raw, label) {

  const now = new Date();
  if (W.step === 'what') {
    if (!v) { wizardBot('内容を入力してください', '例: 「牛乳を買う」「明日の件」'); return; }
    wizardMe(v); W.inputs.push(v);
    const g = parseGroup(v, now);
    if (g && g.items.length >= 2 && (g.every || g.due)) {
      W.group = g; W.step = 'groupAsk';
      wizardBot(`${g.items.length}件のリスト（${g.items.join('・')}）のようです。グループとしてまとめて登録しますか？`, '時間差で順番に通知し、まとめて管理・削除できます');
      return wizardPrompt();
    }
    return afterWhat(v, now);
  }
  if (W.step === 'groupAsk') {
    if (raw === '__group') { const g = W.group, init = { listId: W.listId, extra: W.extra }; W = null; closeSheet(); return openGroupEditor(null, { prefill: g, ...init }); }
    wizardMe('1件として登録'); return afterWhat(W.inputs[W.inputs.length - 1], now);
  }
  if (W.step === 'when') {
    if (raw === '__none') { wizardMe('日時なし'); wizardBot('日時なしでリストに入れておきますね。'); W.due = null; W.rule = null; return askUrl(); }
    if (raw === '__sugg' && W.sugg) { wizardMe(label || whenText(W.sugg.due, W.sugg.rule)); W.due = W.sugg.due; W.rule = W.sugg.rule; wizardBot(`${whenText(W.due, W.rule)} ですね。`); return askUrl(); }
    if (!v) { wizardBot('いつ通知するか入力するか、下の候補を選んでください'); return; }
    wizardMe(label || v); W.inputs.push(v);

(() => {
  const s = $('#sheet'); let d = null;
  s.addEventListener('touchstart', e => {
    const h = e.target.closest('.sheet-h'); if (!h || e.target.closest('button,input,select,textarea,a')) return;
    d = { y: e.touches[0].clientY, t: performance.now(), dy: 0 };
  }, { passive: true });
  s.addEventListener('touchmove', e => {
    if (!d) return;
    const dy = e.touches[0].clientY - d.y;
    d.dy = dy > 0 ? dy : dy / 4; // 上に引いたときは少しだけ抵抗をつけて動かす

  }, { passive: true });
  const end = () => {
    if (!d) return; const g = d; d = null;

function exportObj() {
  return { format: FORMAT, version: FORMAT_VERSION, exportedAt: fmtLocal(new Date()), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Tokyo',
    lists: S.lists, reminders: S.reminders.map(({ lastNotified, lastNagAt, nagCount, ...r }) => (isGroup(r) ? { ...r, steps: r.steps.map(({ lastNotified, snoozeUntil, ...st }) => st) } : r)) };
}
function validateImport(d) {
  if (!d || typeof d !== 'object') throw new Error('JSON の形式ではありません');
  if (d.format && d.format !== FORMAT) throw new Error(`format が "${d.format}" です。"${FORMAT}" のファイルを選んでください`);
  if (!Array.isArray(d.reminders)) throw new Error('reminders 配列が見つかりません');
  const lists = Array.isArray(d.lists) && d.lists.length ? d.lists.filter(l => l && l.id && l.name) : [{ id: 'inbox', name: 'リマインダー', color: 'blue' }];
  const reminders = d.reminders.map((r, i) => {
    if (!r || typeof r.title !== 'string') throw new Error(`${i + 1}件目に title がありません`);
    if (r.due && !parseLocal(r.due)) throw new Error(`${i + 1}件目の due "${r.due}" が読めません（例: 2026-10-20T09:00）`);
    if (r.rule && !['daily', 'weekly', 'monthly', 'yearly', 'parity', 'hourly', 'minutely', 'afterDone'].includes(r.rule.freq)) throw new Error(`${i + 1}件目の rule.freq "${r.rule.freq}" は未対応です`);
    if (r.kind === 'group') {
      if (!Array.isArray(r.steps) || !r.steps.length) throw new Error(`${i + 1}件目のグループに steps がありません`);
      if (!parseLocal(r.due)) throw new Error(`${i + 1}件目のグループの due（最初の通知）が読めません`);
      const unit = u => (['minute', 'hour', 'day'].includes(u) ? u : 'minute');
      return { id: r.id || uid(), kind: 'group', title: r.title, notes: r.notes || '', list: lists.some(l => l.id === r.list) ? r.list : lists[0].id, due: r.due,
        spacing: r.spacing === 'each' ? 'each' : 'equal', every: { value: Math.max(0, +(r.every || {}).value || 0), unit: unit((r.every || {}).unit) },
        urlMode: ['none', 'same', 'each'].includes(r.urlMode) ? r.urlMode : 'none', url: normUrl(r.url),
        steps: r.steps.map((st, j) => { if (!st || typeof st.title !== 'string') throw new Error(`${i + 1}件目のグループの${j + 1}番目に title がありません`); return { id: st.id || uid(), title: st.title, url: normUrl(st.url), after: { value: Math.max(0, +(st.after || {}).value || 0), unit: unit((st.after || {}).unit) }, done: !!st.done, doneAt: st.doneAt || null }; }),
        flagged: !!r.flagged, priority: +r.priority || 0, done: !!r.done, doneAt: r.doneAt || null, history: [], createdAt: r.createdAt || fmtLocal(new Date()) };
    }
    return { id: r.id || uid(), title: r.title, notes: r.notes || '', url: normUrl(r.url), list: lists.some(l => l.id === r.list) ? r.list : lists[0].id, due: r.due || null, rule: r.rule || null, nag: r.nag || null,
      flagged: !!r.flagged, priority: +r.priority || 0, done: !!r.done, doneAt: r.doneAt || null, count: +r.count || 0, history: Array.isArray(r.history) ? r.history : [], input: r.input || '', createdAt: r.createdAt || fmtLocal(new Date()), snoozeUntil: r.snoozeUntil || null };
  });
  return { lists, reminders };
}
function applyImport(d, mode) {
  const v = validateImport(d);
  if (mode === 'replace') { S = { format: FORMAT, version: FORMAT_VERSION, lists: v.lists, reminders: v.reminders }; }
  else {
    for (const l of v.lists) if (!S.lists.some(x => x.id === l.id)) S.lists.push(l);
    const ids = new Set(S.reminders.map(r => r.id));
    for (const r of v.reminders) { if (ids.has(r.id)) r.id = uid(); S.reminders.push(r); }
    delete S.sampleData;
  }
  save(); render();
  return v.reminders.length;
}

      <div class="seg" role="group" aria-label="取り込み方法"><button type="button" data-mode="merge" aria-pressed="true">今のデータに追加</button><button type="button" data-mode="replace" aria-pressed="false">置き換える</button></div>
      <div class="f"><label for="iFile" class="lab" style="color:var(--blue)">ファイルを選ぶ…</label><input type="file" id="iFile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0"></div>
      <textarea class="mono" id="iTxt" placeholder="ここに JSON を貼り付けることもできます" aria-label="インポートする JSON" style="min-height:90px"></textarea>
      <button class="btn" id="iGo">貼り付けた JSON を取り込む</button>
      <div class="msg" id="iMsg"></div>
    </div></div>
    <div><div class="fgroup-h">通知音</div><div class="fgroup">
      <div class="f"><label for="sSound">アプリを開いているとき</label><select id="sSound">${Object.entries(SOUNDS).map(([k, v]) => `<option value="${k}" ${((S.settings && S.settings.sound) || 'chime') === k ? 'selected' : ''}>${v.name}</option>`).join('')}</select></div>
      <button class="btn" id="sPlay">試しに鳴らす</button>
    </div><div class="fgroup-f">アプリを閉じている間に届く通知は、iPhone の標準の通知音で鳴ります。Web アプリからは通知音を変えられない仕組みのためです（音のオン・オフは 設定アプリ →「通知」→「りまいん」で変えられます）。</div></div>
    <div><div class="fgroup-h">登録のしかた</div><div class="fgroup">
      <div class="f"><label for="sQuick">入力欄からすぐ登録</label><input type="checkbox" class="switch" id="sQuick" ${quickMode() ? 'checked' : ''}></div>
    </div><div class="fgroup-f">オフ（標準）: 入力欄に書いて送ると、足りない項目だけを会話で聞き、最後に確認画面を出します。オン: リマインくんのように送った時点で登録します（取り消しボタン付き）。</div></div>
    ${window.rimainPushUI ? '<div id="pushBox"></div>' : `<div><div class="fgroup-h">通知</div><div class="fgroup">
      <div class="f"><span class="lab">端末の通知</span><span class="val" id="nState">${{ granted: '許可済み', denied: '拒否', default: '未設定', unsupported: 'この環境では使えません' }[perm]}</span></div>
      <button class="btn" id="nAsk" ${perm === 'default' ? '' : 'hidden'}>通知を許可する</button>
    </div><div class="fgroup-f">このモックはアプリを開いている間、画面上部のバナーで通知します。閉じている間の通知（Web Push）はホーム画面に追加するアプリ版で使えます。</div></div>`}
    <div><div class="fgroup">
      <button class="btn danger" id="rSample">サンプルデータに戻す</button>
      <div id="rSampleC" hidden><div class="fgroup-f" style="margin:4px 16px 0">今のリマインダーはすべて消えます。先にエクスポートしておくと安全です。</div><button class="btn danger center" id="rSampleYes" style="font-weight:600">サンプルに戻す</button></div>
    </div></div>
  </div>`;
  openSheet(html, sh => {
    const g = id => sh.querySelector('#' + id);
    sh.querySelector('[data-act="ok"]').onclick = closeSheet;
    g('xDl').onclick = async () => {
      const filename = `rimain-${ymd(new Date()).replace(/-/g, '')}.json`;
      // claude.ai 上では downloads 機能で保存、単体の HTML ではブラウザのダウンロードを使う
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) {
        try { await dl.save({ filename, data: json }); g('xMsg').className = 'msg ok'; g('xMsg').textContent = `${filename} を保存しました`; }
        catch (e) { g('xMsg').className = e.code === 'declined' ? 'msg' : 'msg err'; g('xMsg').textContent = e.code === 'declined' ? '保存をキャンセルしました' : 'ここでは保存できませんでした。「JSON をコピー」を使ってください。'; }
        return;
      }
      try {
        const blob = new Blob([json], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `rimain-${ymd(new Date()).replace(/-/g, '')}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        g('xMsg').className = 'msg ok'; g('xMsg').textContent = '保存を開始しました。保存されない場合は「JSON をコピー」を使ってください。';
      } catch (e) { g('xMsg').className = 'msg err'; g('xMsg').textContent = 'この環境ではファイル保存ができません。「JSON をコピー」を使ってください。'; }
    };
    g('xCopy').onclick = () => {
      const ok = () => { g('xMsg').className = 'msg ok'; g('xMsg').textContent = 'コピーしました'; };
      const fallback = () => { const t = g('xTxt'); t.focus(); t.select(); g('xMsg').className = 'msg'; g('xMsg').textContent = '下のテキストを選択しました。コピーしてください。'; };
      try { navigator.clipboard.writeText(json).then(ok, fallback); } catch (e) { fallback(); }
    };
    sh.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; sh.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    const doImport = text => {
      try { const n = applyImport(JSON.parse(text), mode); g('iMsg').className = 'msg ok'; g('iMsg').textContent = `${n}件を${mode === 'replace' ? '置き換えて' : '追加して'}取り込みました`; }
      catch (e) { g('iMsg').className = 'msg err'; g('iMsg').textContent = e instanceof SyntaxError ? 'JSON として読めませんでした。括弧やカンマを確認してください' : e.message; }
    };
    g('iFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => doImport(String(fr.result)); fr.readAsText(f); };
    g('iGo').onclick = () => { const t = g('iTxt').value.trim(); if (t) doImport(t); };
    if (window.rimainPushUI) window.rimainPushUI(g('pushBox'));
    if (g('nAsk')) g('nAsk').onclick = async () => {
      try { const p = await Notification.requestPermission(); g('nState').textContent = { granted: '許可済み', denied: '拒否', default: '未設定' }[p] || p; g('nAsk').hidden = p !== 'default'; }
      catch (e) { g('nState').textContent = 'この環境では使えません'; g('nAsk').hidden = true; }
    };
    g('sSound').onchange = e => { S.settings = { ...(S.settings || {}), sound: e.target.value }; save(); playSound(e.target.value); };
    g('sPlay').onclick = () => playSound(g('sSound').value);
    g('sQuick').onchange = e => { S.settings = { ...(S.settings || {}), quickAdd: e.target.checked }; save(); updateModeLbl(); };
    g('rSample').onclick = () => { g('rSampleC').hidden = false; g('rSample').hidden = true; };
    g('rSampleYes').onclick = () => { S = sample(); save(); closeSheet(); view = { name: 'home' }; render(); toast('サンプルに戻しました'); };
  });
}

// ---- 通知ループ ----
const queue = [];
// 通知音（アプリを開いている間のバナー用）。音声ファイルは持たず、Web Audio で合成する。
// iPhone では最初のタップで音を出せる状態にしておく必要がある
const SOUNDS = {
  chime: { name: 'チャイム', notes: [[880, 0, .5], [1318.5, .16, .7]], type: 'sine' },
  bell: { name: 'ベル', notes: [[1046.5, 0, 1.1], [1568, 0, .8], [2093, 0, .5]], type: 'sine' },
  pop: { name: 'ポップ', notes: [[660, 0, .12], [990, .09, .18]], type: 'triangle' },
  marimba: { name: 'マリンバ', notes: [[784, 0, .35], [988, .12, .35], [1175, .24, .5]], type: 'sine' },
  digital: { name: 'デジタル', notes: [[1760, 0, .09], [1760, .14, .09], [1760, .28, .09]], type: 'square' },
  none: { name: 'なし', notes: [] },
};
let audioCtx = null;
function audio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} return audioCtx; }
document.addEventListener('pointerdown', () => audio(), { once: true, passive: true });
function playSound(key = (S.settings && S.settings.sound) || 'chime') {
  const snd = SOUNDS[key] || SOUNDS.chime; if (!snd.notes.length) return;
  const ctx = audio(); if (!ctx) return;
  const t0 = ctx.currentTime + .02;
  for (const [f, at, len] of snd.notes) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = snd.type; o.frequency.value = f;
    const vol = snd.type === 'square' ? .05 : .22;
    g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(vol, t0 + at + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + at + len);
    o.connect(g); g.connect(ctx.destination); o.start(t0 + at); o.stop(t0 + at + len + .05);
  }
}
function notify(r, test = false, step = null) {
  if (!document.hidden) playSound();
  if (!queue.some(x => x.id === r.id && x.step === step)) queue.push({ id: r.id, test, step });
  const st = step != null ? r.steps[step] : null;
  const title = st ? st.title : r.title;
  const url = st ? stepUrl(r, st) : r.url;
  try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden && !window.rimainPushOn) { const n = new Notification(title, { body: url ? 'タップして開く: ' + url : st ? `${r.title}（${step + 1}/${r.steps.length}）` : r.rule ? describeRule(r.rule) : 'りまいん', tag: r.id + (st ? ':' + step : '') }); if (url) n.onclick = () => { window.open(url, '_blank', 'noopener'); n.close(); }; } } catch (e) {}
  showBanner();
}
function showBanner() {
  const b = $('#banner');
  if (!queue.length) { b.hidden = true; return; }
  const { id, test, step } = queue[0];
  const r0 = S.reminders.find(x => x.id === id);
  if (!r0 || (step != null && !r0.steps[step])) { queue.shift(); return showBanner(); }
  // グループの項目は、その項目の内容と URL で通知する
  let r = r0, sub;
  if (step != null) {
    const st = r0.steps[step], ts = stepTimes(r0), nxt = r0.steps[step + 1];
    r = { id: r0.id, title: st.title, url: stepUrl(r0, st) };
    sub = `${r0.title}（${step + 1}/${r0.steps.length}）${nxt ? ` ・ 次: ${nxt.title} ${hm(ts[step + 1])}` : ' ・ 最後の項目'}`;
  } else sub = [r.rule ? '↻ ' + describeRule(r.rule) : '', r.nag ? `完了するまで${r.nag.every}分ごとにお知らせします` : ''].filter(Boolean).join(' ・ ');
  b.innerHTML = `<div class="bn-top"><span class="appic">り</span>りまいん${test ? '（テスト）' : ''}${queue.length > 1 ? ` ・ ほか${queue.length - 1}件` : ''}<span class="when">今</span></div>
    ${r.url ? `<a class="bn-main" href="${esc(r.url)}" target="_blank" rel="noopener" data-bn-open><div class="bn-title">${esc(r.title)}</div>${sub ? `<div class="bn-sub">${esc(sub)}</div>` : ''}<div class="bn-url">タップして開く: ${esc(r.url)}</div></a>`
      : `<div><div class="bn-title">${esc(r.title)}</div>${sub ? `<div class="bn-sub">${esc(sub)}</div>` : ''}</div>`}
    <div class="bn-acts">${r.url ? `<a class="pri btnlike" href="${esc(r.url)}" target="_blank" rel="noopener" data-bn-open>開く</a>` : ''}<button class="${r.url ? '' : 'pri'}" data-bn="done">完了</button><button data-bn="5">5分後</button><button data-bn="60">1時間後</button><button data-bn="1440">明日</button>${test ? '<button data-bn="close">閉じる</button>' : ''}</div>`;
  b.hidden = false;
  // URL を開いたら通知は閉じる（完了にはしない。繰り返しの次回はそのまま）
  b.querySelectorAll('[data-bn-open]').forEach(a => a.addEventListener('click', () => { setTimeout(() => { queue.shift(); render(); showBanner(); }, 50); }));
  b.querySelectorAll('[data-bn]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.bn; let msg = '';
    if (!test || a !== 'close') {
      if (step != null) {
        if (a === 'done') msg = esc(completeStep(r0, step));
        else if (a !== 'close') { const d = new Date(); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + +a); r0.steps[step].snoozeUntil = fmtLocal(d); r0.steps[step].lastNotified = null; save(); msg = `${fmtDue(d)} にもう一度お知らせします`; }
      } else if (a === 'done') msg = `「${esc(r.title)}」${completeRem(r)}`;
      else if (a !== 'close') msg = snooze(r, +a);
    }
    queue.shift(); render(); if (msg) toast(msg); showBanner();
  });
}
function tick() {
  const now = new Date();
  for (const r of S.reminders) {
    if (r.done) continue;
    if (isGroup(r)) {
      const ts = stepTimes(r);
      r.steps.forEach((st, i) => {
        if (st.done) return;
        const t = st.snoozeUntil ? parseLocal(st.snoozeUntil) : ts[i];
        if (!t || t > now) return;
        const key = fmtLocal(t);
        if (st.lastNotified !== key) { st.lastNotified = key; save(); notify(r, false, i); }
      });
      continue;
    }
    const d = dueOf(r); if (!d || d > now) continue;
    const key = r.snoozeUntil || r.due;
    if (r.lastNotified !== key) {
      r.lastNotified = key; r.lastNagAt = fmtLocal(now) + ':' + pad(now.getSeconds()); r.nagCount = 0; save(); notify(r);
    } else if (r.nag && r.lastNagAt && (r.nagCount || 0) < 24) {
      const last = new Date(r.lastNagAt.slice(0, 16)); last.setSeconds(+r.lastNagAt.slice(17) || 0);
      if (now - last >= r.nag.every * 60000) { r.lastNagAt = fmtLocal(now) + ':' + pad(now.getSeconds()); r.nagCount = (r.nagCount || 0) + 1; save(); notify(r); }
    }
  }
}

// ---- 起動 ----
S = load() || sample();
save();
render();
updatePreview();
updateModeLbl();
tick();
setInterval(tick, 10000);
setInterval(() => { if ($('#sheetWrap').hidden && !document.activeElement?.closest?.('#scroll')) render(); }, 60000);
</script>
