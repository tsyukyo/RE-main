<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<link rel="icon" href="icon-192.png">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head><body>
<title>RE:main</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RE:main">
<style>
/* Layout: iOS「リマインダー」準拠の1カラムアプリ。下部にリマインくん式の自然文入力バーを常設 */
:root {
  --bg: #f2f2f7; --card: #ffffff; --fg: #000000; --fg2: #8a8a8e; --fg3: #c4c4c7; --sep: rgba(60,60,67,.18);
  --fill: rgba(118,118,128,.12); --blue: #007aff; --red: #ff3b30; --orange: #ff9500; --green: #34c759;
  --purple: #af52de; --gray: #8e8e93; --teal: #30b0c7; --indigo: #5856d6; --bar: rgba(249,249,249,.94);
  --shadow: 0 10px 30px rgba(0,0,0,.18);
  /* 動きのトークン（ui-ux-pro-max: motion-consistency）。押下は速く、戻りと入場はばね、退場は短く */
  --ease-out: cubic-bezier(.22,1,.36,1); --ease-in: cubic-bezier(.4,0,1,1); --spring: cubic-bezier(.34,1.45,.64,1);
  --ease-sheet: cubic-bezier(.32,.72,0,1); --t-press: 80ms; --t-exit: 220ms;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1c1c1e; --fg: #ffffff; --fg2: #98989f; --fg3: #48484a; --sep: rgba(84,84,88,.6);
  --fill: rgba(118,118,128,.24); --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158;
  --purple: #bf5af2; --gray: #98989d; --teal: #40c8e0; --indigo: #5e5ce6; --bar: rgba(22,22,24,.94);
  --shadow: 0 10px 30px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fg: #ffffff; --fg2: #98989f; --fg3: #48484a; --sep: rgba(84,84,88,.6);
  --fill: rgba(118,118,128,.24); --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158;
  --purple: #bf5af2; --gray: #98989d; --teal: #40c8e0; --indigo: #5e5ce6; --bar: rgba(22,22,24,.94);
  --shadow: 0 10px 30px rgba(0,0,0,.6); color-scheme: dark; }
html, body { height: 100%; }
/* ダブルタップでの拡大と、文字サイズの自動調整を止める（入力時のズームは viewport と 16px 以上の文字で防ぐ） */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 520px; margin: 0 auto; height: var(--vvh, 100%); display: flex; flex-direction: column; position: relative; background: var(--bg); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ナビゲーションバー */
.nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; padding-block: 4px; }
.nav .left { justify-self: start; } .nav .right { justify-self: end; display: flex; gap: 6px; }
.navbtn { color: var(--blue); display: inline-flex; align-items: center; gap: 2px; font-size: 17px; min-height: 44px; }
.navbtn svg { width: 22px; height: 22px; }
/* 右上・左上のボタンは丸い面を付けて大きく（タップ領域 44px） */
.nav .navbtn { min-width: 44px; justify-content: center; }
.nav .right .navbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--fill); }
.nav .navbtn svg { width: 26px; height: 26px; }
#backBtn { font-size: 18px; padding-right: 6px; margin-left: -6px; }
#backBtn svg { width: 30px; height: 30px; }
.nav-title { font-weight: 600; opacity: 0; transition: opacity .2s; }
.nav-title.show { opacity: 1; }
.scroll { flex: 1; overflow-y: auto; background: var(--bg); view-transition-name: page; -webkit-overflow-scrolling: touch; padding-block: 0 24px; }
.large { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 2px 0 12px; text-wrap: balance; }

/* 検索 */
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 8px; height: 36px; margin-bottom: 18px; }
.search svg { width: 16px; height: 16px; color: var(--fg2); flex: none; }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 17px; }
.search input::placeholder { color: var(--fg2); }

/* スマートリスト */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.home-h { margin: 0 2px 10px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--fg2); letter-spacing: .04em; }
.home-t { margin: 0; letter-spacing: -.02em; }
.home-t .c { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .02em; }
:root { --brand: linear-gradient(135deg, #5846f5, #18aaff); }
.pills { display: flex; gap: 8px; margin-bottom: 28px; }
.pill { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--card); font-size: 15px; font-weight: 600; color: var(--fg); transition: transform .5s var(--spring), filter .3s, background-color .25s; }
.pill .pdot { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.pill .pdot svg { width: 14px; height: 14px; }
.pill .pn { margin-left: auto; color: var(--fg2); font-variant-numeric: tabular-nums; }
.pill.is-pressed { transform: scale(.95); filter: grayscale(1); transition-duration: var(--t-press); }
.sec-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sec-row .sec-h { margin: 0; }
.sec-row .addlist { margin: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); }
.sec-row .addlist svg { width: 18px; height: 18px; }
.tile { background: var(--card); border-radius: 14px; padding: 12px 14px 11px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; text-align: left; min-height: 82px; }
.tile .ic { width: 32px; height: 32px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; }
.tile .ic svg { width: 18px; height: 18px; }
.tile .num { font-size: 28px; font-weight: 700; line-height: 32px; font-variant-numeric: tabular-nums; }
.tile .lbl { grid-column: 1 / -1; align-self: end; font-weight: 600; color: var(--fg2); font-size: 15px; margin-top: 8px; }
.sec-h { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 14px; text-align: left; min-height: 52px; }
.lrow { position: relative; }
.lrow + .lrow::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.lrow .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; flex: none; }
.lrow .dot svg { width: 17px; height: 17px; }
.lrow .name { flex: 1; min-width: 0; }
.lrow .cnt { color: var(--fg2); font-variant-numeric: tabular-nums; }
.lrow .chev { width: 8px; color: var(--fg3); }
.addlist { color: var(--blue); margin-top: 14px; font-size: 17px; }
.hint { color: var(--fg2); font-size: 13px; line-height: 1.5; margin: 16px 4px 0; text-align: center; }

/* リマインダー行 */
.items { display: flex; flex-direction: column; }
.day-h { font-size: 20px; font-weight: 700; margin: 22px 0 4px; display: flex; align-items: baseline; gap: 8px; }
.day-h small { font-size: 13px; color: var(--red); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; position: relative; }
.row::after { content: ""; position: absolute; left: 36px; right: 0; bottom: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--fg3); flex: none; margin-top: 1px; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: transparent; transition: background .15s; }
.row.done .check, .check.on { border-color: var(--c); }
.row.done .check::after, .check.on::after { background: var(--c); }
.row-main { flex: 1; min-width: 0; text-align: left; }
.row-title { line-height: 1.3; word-break: break-word; }
.row.done .row-title { color: var(--fg2); }
.prio { color: var(--c); font-weight: 700; margin-right: 3px; }
.row-sub { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 15px; color: var(--fg2); margin-top: 3px; align-items: center; }
.row-sub .over { color: var(--red); }
.row-sub .rep { display: inline-flex; align-items: center; gap: 3px; }
.row-sub svg { width: 13px; height: 13px; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.badge.snz { background: color-mix(in srgb, var(--indigo) 16%, transparent); color: var(--indigo); }
.row-notes { font-size: 15px; color: var(--fg2); margin-top: 2px; }
.flag { color: var(--orange); width: 16px; flex: none; margin-top: 3px; }
.empty { text-align: center; color: var(--fg2); padding: 48px 12px; line-height: 1.6; }
.foot-note { color: var(--fg2); font-size: 13px; margin-top: 18px; }

/* 入力バー（リマインくん式） */
.composer { background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.qform { display: flex; gap: 8px; align-items: center; }
.qform input { flex: 1; min-width: 0; height: 50px; border-radius: 25px; border: .5px solid var(--sep); background: var(--card); padding: 0 18px; font-size: 17px; outline: none; transition: border-color .2s, box-shadow .25s var(--ease-out); }
.qform input:focus, .urlrow input:focus, .chat-in input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent); }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px color-mix(in srgb, var(--blue) 40%, transparent); }
.send:disabled { background: var(--fg3); box-shadow: none; transform: scale(.86); }
.send svg { width: 22px; height: 22px; }
.preview { background: var(--card); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; box-shadow: 0 1px 0 var(--sep); }
.pv-title { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--fg); display: inline-flex; gap: 4px; align-items: center; }
.chip.k { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
.chip.n { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.chip.w { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.pv-note { font-size: 12px; color: var(--fg2); }
.wg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.wg-h { flex-basis: 100%; font-size: 12px; font-weight: 600; color: var(--fg2); letter-spacing: .04em; margin-bottom: -2px; }
.chat-in .chips.when { display: grid; gap: 10px; max-height: min(34svh, 42vh); overflow-y: auto; overscroll-behavior: contain; padding-bottom: 2px; }
.chat-in .chips button.sugg { background: var(--blue); color: #fff; border-color: transparent; }
.linkbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--fg2); flex: none; }
.linkbtn[aria-pressed="true"], .linkbtn.has { color: var(--blue); }
.linkbtn svg { width: 22px; height: 22px; }
.urlrow { display: flex; gap: 8px; align-items: center; }
.urlrow input { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: .5px solid var(--sep); background: var(--card); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
.urlrow .lab { font-size: 13px; color: var(--fg2); white-space: nowrap; }
.chip.u { background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlink { display: inline-flex; align-items: center; gap: 3px; color: var(--blue); text-decoration: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlink svg { flex: none; }
.bn-main { display: block; color: inherit; text-decoration: none; }
.bn-url { font-size: 13px; color: var(--blue); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet.tall { height: calc(100% - 40px - env(safe-area-inset-top, 0px)); }
.chat { flex: 1; overflow-y: auto; padding-block: 16px; display: flex; flex-direction: column; gap: 10px; }
.bub { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; }
.bub .av { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; }
.bub .tx { padding: 9px 13px; border-radius: 18px; line-height: 1.45; font-size: 16px; word-break: break-word; }
.bub.bot .tx { background: var(--card); border-bottom-left-radius: 6px; }
.bub.me { align-self: flex-end; }
.bub.me .tx { background: var(--blue); color: #fff; border-bottom-right-radius: 6px; }
.bub .sub { display: block; font-size: 13px; color: var(--fg2); margin-top: 3px; }
.bub.pop { animation: pop .5s var(--spring) both; transform-origin: bottom left; }
.bub.bot.pop .tx { animation: grow .45s .5s var(--spring) both; transform-origin: left center; }
@keyframes grow { from { transform: scale(.96); } }
.bub.me.pop { transform-origin: bottom right; }
@keyframes pop { from { transform: translateY(10px) scale(.9); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .bub.pop { animation: none; } }
.chat-in { border-top: .5px solid var(--sep); background: var(--bar); padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.chat-in .chips button { font-size: 16px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--card); border: .5px solid var(--sep); color: var(--blue); font-weight: 600; }
.chat-in .chips button.skip { color: var(--fg); }
.chat-in form { display: flex; gap: 8px; }
.chat-in input { flex: 1; min-width: 0; height: 50px; border-radius: 25px; border: .5px solid var(--sep); background: var(--card); padding: 0 18px; font-size: 17px; outline: none; transition: border-color .2s, box-shadow .25s var(--ease-out); }
.chat-in .next { height: 50px; padding: 0 20px; border-radius: 25px; background: var(--blue); color: #fff; font-weight: 600; flex: none; }
.steps { display: flex; gap: 4px; justify-content: center; padding-top: 2px; }
.steps i { width: 18px; height: 4px; border-radius: 2px; background: var(--fill); }
.steps i.on { background: var(--blue); }
.newbtn { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 600; font-size: 17px; min-height: 36px; }
.newbtn .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
.newbtn .plus svg { width: 14px; height: 14px; }
.cbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cbar .mode { font-size: 12px; color: var(--fg2); order: 3; flex-basis: 100%; margin-top: -6px; padding-left: 30px; }
.cbar .mode:empty { display: none; }
.cbar { flex-wrap: wrap; }
.confirm-note { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--fg2); line-height: 1.5; margin: 0 4px; }
.confirm-note b { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 11px; display: grid; place-items: center; }
.gsteps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.gs { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--fill); color: var(--fg); font-variant-numeric: tabular-nums; }
.gs.done { text-decoration: line-through; color: var(--fg2); }
.gs.next { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); font-weight: 600; }
.gbadge { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
.gstep { padding: 8px 12px 8px 16px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 30px; gap: 4px 8px; align-items: center; position: relative; }
.gstep + .gstep::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.gstep .no { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.gstep input[type=text] { width: 100%; min-width: 0; border: 0; background: transparent; outline: none; padding: 8px 0; font-size: 17px; }
.gstep .tm { font-size: 14px; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gstep .rm { width: 28px; height: 28px; border-radius: 50%; color: var(--red); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.gstep .sub { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--fg2); }
.gstep .sub input[type=number] { width: 64px; text-align: right; border: 0; background: var(--fill); border-radius: 8px; padding: 5px 8px; font-size: 16px; }
.gstep .sub select { border: 0; background: var(--fill); border-radius: 8px; padding: 5px 8px; font-size: 16px; }
.gstep .sub input[type=url] { flex: 1; min-width: 0; border: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 16px; color: var(--blue); }
.gstep.done input[type=text] { text-decoration: line-through; color: var(--fg2); }
.gsum { font-size: 13px; color: var(--fg2); margin: 6px 16px 0; font-variant-numeric: tabular-nums; }
.inl { display: flex; gap: 8px; align-items: center; padding: 8px 16px; }
.inl input[type=text] { flex: 1; min-width: 0; border: 0; background: var(--fill); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.inl button { color: var(--blue); font-weight: 600; white-space: nowrap; }
.toast .undo { color: var(--blue); font-weight: 700; margin-left: 10px; filter: brightness(1.4); }
.f input[type=url] { width: 100%; border: 0; background: transparent; outline: none; padding: 12px 0; font-size: 16px; color: var(--blue); }
.examples { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.composer:not(:focus-within) .examples { display: none; }
.cbar-r { display: flex; align-items: center; gap: 12px; }
.cbar-r .newbtn { color: var(--fg2); font-size: 15px; font-weight: 500; gap: 4px; white-space: nowrap; }
.newbtn { white-space: nowrap; }
@media (max-width: 380px) { .cbar > .newbtn { font-size: 16px; } .cbar-r { gap: 8px; } .cbar-r .newbtn { font-size: 14px; } }
.examples::-webkit-scrollbar { display: none; }
.ex { white-space: nowrap; font-size: 13px; padding: 6px 11px; border-radius: 999px; background: var(--card); border: .5px solid var(--sep); }

/* シート */
.sheet-wrap { position: fixed; left: 0; right: 0; top: 0; height: var(--vvh, 100%); background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: scrimIn .35s var(--ease-out); }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; position: relative; animation: up .52s var(--ease-sheet); box-shadow: 0 -8px 30px rgba(0,0,0,.12); }
.sheet::before { content: ""; position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--fg3); opacity: .7; z-index: 1; }
.sheet.dragging { animation: none; transition: none; }
.sheet.settle { transition: transform .45s var(--spring); }
.sheet-wrap.closing { pointer-events: none; animation: scrimOut var(--t-exit) var(--ease-in) forwards; }
.sheet-wrap.closing .sheet { animation: down var(--t-exit) var(--ease-in) forwards; }
@keyframes up { from { transform: translateY(100%); } }

/* 押した感触（ui-ux-pro-max: press-feedback / scale-feedback / spring-physics）

.newbtn, .send, .linkbtn, .tile, .addlist, .ex, .act-btn, .chat-in .chips button, .chat-in .next, .bn-acts button, .bn-acts a.btnlike, .wd button, .colors button, .seg button, .adv-add button, .gstep .rm, .inl button, .guide code, .sw-btn, .mic, .calbtn, .cal-q button, .cal-t button, .cal-r button, .cal-mh button, .sc-src button, .sc-go {

  const lists = [
    { id: 'inbox', name: 'リマインダー', color: 'blue' },

const SMART = {

  return arr.slice().sort((a, b) => {

function render() {

// 戻るスワイプ中に下へ敷く前の画面。id は重複しないよう外す
function makeUnder() {
  const sc = $('#scroll'), app = $('#app');
  const u = document.createElement('div'); u.className = 'under gut';
  u.style.top = sc.offsetTop + 'px'; u.style.height = sc.offsetHeight + 'px';
  u.innerHTML = `<div class="inner">${renderHome().replace(/ id="/g, ' data-x="')}</div>`;

function moveUnder(u, f, anim) {

    wizardMe(label || v); W.inputs.push(v);

// ---- 音声入力 ----
// Safari の音声認識を使い、聞き取った言葉を入力欄に書き込む（あとは手で打ったときと同じ流れ）。
// ホーム画面のアプリでは使えないことがあるので、そのときはキーボードのマイクを案内する
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let voice = null;
function stopVoice() { if (voice) try { voice.rec.stop(); } catch {} }
function startVoice(inp, btn) {
  if (voice) return stopVoice();
  const fallback = msg => { toast(esc(msg)); inp.focus(); };
  if (!SpeechRec) return fallback('この画面では音声認識が使えません。キーボードのマイクで話してください');
  let rec; try { rec = new SpeechRec(); } catch { return fallback('音声認識を始められませんでした。キーボードのマイクで話してください'); }
  const base = inp.value.trim();
  let fin = '';
  rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => {
    let tmp = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else tmp += t; }
    inp.value = (base ? base + ' ' : '') + fin + tmp;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = e => {
    if (e.error === 'aborted') return;
    if (e.error === 'no-speech') return toast('声が聞き取れませんでした。もう一度マイクを押して話してください');
    fallback(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'マイクが使えませんでした。キーボードのマイクで話すこともできます' : '音声認識が使えませんでした。キーボードのマイクで話してください');
  };
  rec.onend = () => { if (voice && voice.rec === rec) voice = null; btn.classList.remove('rec'); btn.setAttribute('aria-pressed', 'false'); btn.setAttribute('aria-label', '話して入力'); };
  voice = { rec, btn };
  btn.classList.add('rec'); btn.setAttribute('aria-pressed', 'true'); btn.setAttribute('aria-label', '聞き取りを止める');
  try { rec.start(); } catch { voice = null; btn.classList.remove('rec'); btn.setAttribute('aria-pressed', 'false'); fallback('音声認識を始められませんでした。キーボードのマイクで話してください'); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mic]'); if (!b) return;
  e.preventDefault(); const inp = document.getElementById(b.dataset.mic); if (inp) startVoice(inp, b);
});

// ---- カレンダーで日時を選ぶ ----
// よく使う日・月のカレンダー・よく使う時刻から選ぶ。結果は話し言葉と同じ書き方の文（例「10月28日から毎週水曜 9:00」）にして
// パーサーに通すので、繰り返しの計算は文章で登録したときと同じになる
let CAL = null;
function calText(c) {

// シートの上端（タイトル部分）を下に引くと閉じる
(() => {

    const h = e.target.closest('.sheet-h'); if (!h || e.target.closest('button,input,select,textarea,a')) return;

  }, { passive: true });

// キーボードが出ている間は、見えている高さにアプリとシートを合わせる（iOS は画面ごと押し上げて送信ボタンが隠れるため）

    const commit = () => {
      r.title = g('dTitle').value.trim() || r.title;

      const u = g('dUrl').value.trim();
      if (u && !normUrl(u)) { g('dUrlMsg').style.color = 'var(--red)'; g('dUrlMsg').textContent = 'URL は https:// から始まる形で入力してください'; g('dUrl').focus(); return; }
      r.url = normUrl(u);
      const newDue = g('dDue').value || null;
      if (newDue !== r.due) { r.snoozeUntil = null; r.lastNotified = null; }
      r.due = newDue;
      r.rule = sh._rule || null;
      r.nag = g('dNag').checked ? { every: Math.max(1, +g('dNagEv').value || 5) } : null;
      r.flagged = g('dFlag').checked; r.priority = +g('dPri').value; r.list = g('dList').value;
      if (isNew) { S.reminders.push(r); W = null; save(); closeSheet(); render(); registeredToast(r); return; }
      save(); closeSheet(); render(); toast('保存しました');
    };

    if (isNew) g('dRegister').onclick = commit;
    g('dTest').onclick = () => { closeSheet(); notify(r, true); };
    g('dDel').onclick = () => { g('dDelConfirm').hidden = false; g('dDel').hidden = true; };
    g('dDelYes').onclick = () => { S.reminders = S.reminders.filter(x => x.id !== r.id); save(); closeSheet(); render(); toast('削除しました'); };
  });
}

  };
  openSheet(sheetHead(isNew ? 'グループで登録' : 'グループ', isNew ? '登録' : '完了') + `<div class="sheet-b gut" id="gBody"></div>`, sh => {
    const B = sh.querySelector('#gBody');

    });
    B.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'gEveryU') G.every.unit = t.value;
      else if (t.dataset.f === 'au') { const st = G.steps[+t.dataset.i]; st.after = { ...(st.after || { value: 30 }), unit: t.value }; }
      else if (t.id === 'gList') G.list = t.value;
      else if (t.id === 'gFlag') G.flagged = t.checked;

    const addItems = txt => txt.split(/[、,，・\n]+/).map(x => x.trim()).filter(Boolean).map(t => ({ id: uid(), title: t, after: { ...G.every } }));

      else if (t.id === 'gDelYes') { S.reminders = S.reminders.filter(x => x.id !== orig.id); save(); closeSheet(); render(); toast(`グループ「${esc(orig.title)}」を削除しました`); }

      if (!G.due || !parseLocal(G.due)) { draw(); return err('最初の通知の日時を入れてください'); }
      if (G.urlMode === 'same') { const u = normUrl(G.url); if (!u) { draw(); return err('共通の URL は https:// から始まる形で入力してください'); } G.url = u; }
      if (G.urlMode === 'each') { for (const st of G.steps) { if (st.url && !normUrl(st.url)) { draw(); return err(`「${st.title}」の URL が読めません`); } st.url = normUrl(st.url); } }

}

let clipPending = null, clipKey = null;
const markCopied = () => document.querySelectorAll('.copy-btn').forEach(c => { c.textContent = 'コピー済み'; });
// 自動でコピーを試し、許可されなければ次のタップでコピーする
function autoCopy(key, text) {
  if (!text || clipKey === key) return;
  clipKey = key; clipPending = null;
  const done = () => { clipPending = null; markCopied(); toast('通知の内容をコピーしました', 1600); };
  const tryNow = () => document.hasFocus() && navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text).then(done, () => { clipPending = text; }) : Promise.resolve(clipPending = text);
  tryNow();
}
const clipOnTap = e => {
  if (!clipPending) return;
  const text = clipPending; clipPending = null;
  writeClip(text).then(ok => { if (ok) { markCopied(); if (!e.target.closest('.copy-btn')) toast('通知の内容をコピーしました', 1600); } else clipPending = text; });
};
document.addEventListener('touchend', clipOnTap, true);
document.addEventListener('click', clipOnTap, true);
window.addEventListener('focus', () => { if (clipPending && navigator.clipboard) { const t = clipPending; navigator.clipboard.writeText(t).then(() => { if (clipPending === t) { clipPending = null; markCopied(); toast('通知の内容をコピーしました', 1600); } }, () => {}); } });
function showBanner() {
  const b = $('#banner');
  if (!queue.length) { b.hidden = true; clipPending = null; return; }
  const { id, test, step } = queue[0];
  const r0 = S.reminders.find(x => x.id === id);
  if (!r0 || (step != null && !r0.steps[step])) { queue.shift(); return showBanner(); }
  // グループの項目は、その項目の内容と URL で通知する
  let r = r0, sub;
  if (step != null) {
    const st = r0.steps[step], ts = stepTimes(r0), nxt = r0.steps[step + 1];
    r = { id: r0.id, title: st.title, url: stepUrl(r0, st) };
    sub = `${r0.title}（${step + 1}/${r0.steps.length}）${nxt ? ` ・ 次: ${nxt.title} ${hm(ts[step + 1])}` : ' ・ 最後の項目'}`;
  } else sub = [r.rule ? '↻ ' + describeRule(r.rule) : '', r.nag ? `完了するまで${r.nag.every}分ごとにお知らせします` : ''].filter(Boolean).join(' ・ ');
  b.innerHTML = `<div class="bn-top"><span class="appic">R</span>RE:main${test ? '（テスト）' : ''}${queue.length > 1 ? ` ・ ほか${queue.length - 1}件` : ''}<span class="when">今</span></div>
    ${r.url ? `<a class="bn-main" href="${esc(r.url)}" target="_blank" rel="noopener" data-bn-open><div class="bn-title">${esc(r.title)}</div>${sub ? `<div class="bn-sub">${esc(sub)}</div>` : ''}<div class="bn-url">タップして開く: ${esc(r.url)}</div></a>`
      : `<div><div class="bn-title">${esc(r.title)}</div>${sub ? `<div class="bn-sub">${esc(sub)}</div>` : ''}</div>`}
    <div class="bn-acts">${r.url ? `<a class="pri btnlike" href="${esc(r.url)}" target="_blank" rel="noopener" data-bn-open>開く</a>` : ''}<button class="${r.url ? '' : 'pri'}" data-bn="done">完了</button><button data-bn="5">5分後</button><button data-bn="60">1時間後</button><button data-bn="1440">明日</button>${test ? '<button data-bn="close">閉じる</button>' : ''}</div>`;
  b.hidden = false;
  const clip = copyTextFor(r, r0);
  if (clip) {
    b.querySelector('.bn-acts').insertAdjacentHTML('afterbegin', `<button id="bnCopy" class="copy-btn" type="button">コピー</button>`);
    b.querySelector('#bnCopy').onclick = () => writeClip(clip).then(ok => { b.querySelector('#bnCopy').textContent = ok ? 'コピー済み' : 'コピーできません'; });
    autoCopy(id + ':' + (step ?? '') + ':' + (r0.lastNotified || r0.due || ''), clip);
  }
  // URL を開いたら通知は閉じる（完了にはしない。繰り返しの次回はそのまま）
  b.querySelectorAll('[data-bn-open]').forEach(a => a.addEventListener('click', () => { setTimeout(() => { queue.shift(); render(); showBanner(); }, 50); }));
  b.querySelectorAll('[data-bn]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.bn; let msg = '';
    if (!test || a !== 'close') {
      if (step != null) {
        if (a === 'done') msg = esc(completeStep(r0, step));
        else if (a !== 'close') { const d = new Date(); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + +a); r0.steps[step].snoozeUntil = fmtLocal(d); r0.steps[step].lastNotified = null; save(); msg = `${fmtDue(d)} にもう一度お知らせします`; }
      } else if (a === 'done') msg = `「${esc(r.title)}」${completeRem(r)}`;
      else if (a !== 'close') msg = snooze(r, +a);
    }
    queue.shift(); render(); if (msg) toast(msg); showBanner();
  });
}
function tick() {
  const now = new Date();
  for (const r of S.reminders) {
    if (r.done) continue;
    if (isGroup(r)) {
      const ts = stepTimes(r);
      r.steps.forEach((st, i) => {
        if (st.done) return;
        const t = st.snoozeUntil ? parseLocal(st.snoozeUntil) : ts[i];
        if (!t || t > now) return;
        const key = fmtLocal(t);
        if (st.lastNotified !== key) { st.lastNotified = key; save(); notify(r, false, i); }
      });
      continue;
    }
    const d = dueOf(r); if (!d || d > now) continue;
    const key = r.snoozeUntil || r.due;
    if (r.lastNotified !== key) {
      r.lastNotified = key; r.lastNagAt = fmtLocal(now) + ':' + pad(now.getSeconds()); r.nagCount = 0; save(); notify(r);
    } else if (r.nag && r.lastNagAt && (r.nagCount || 0) < 24) {
      const last = new Date(r.lastNagAt.slice(0, 16)); last.setSeconds(+r.lastNagAt.slice(17) || 0);
      if (now - last >= r.nag.every * 60000) { r.lastNagAt = fmtLocal(now) + ':' + pad(now.getSeconds()); r.nagCount = (r.nagCount || 0) + 1; save(); notify(r); }
    }
  }
}

// ---- 起動 ----
S = load() || (wantsSample() ? sample() : emptyData());
save();
render();
updatePreview();
updateModeLbl();
tick();
setInterval(tick, 10000);
setInterval(() => { if ($('#sheetWrap').hidden && !document.activeElement?.closest?.('#scroll')) render(); }, 60000);
</script>

<script src="pwa.js"></script>
</body></html>
